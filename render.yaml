services:
  - type: web
    name: peter-mutua-portfolio
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_ROOT
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: portfolio-storage
      mountPath: /var/data
      sizeGB: 1